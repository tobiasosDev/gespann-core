[package]
name = "gespann-orchestrator"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "gespann's job orchestrator: queue, sandboxes and every job step, apart from the UI."
publish = false

[[bin]]
name = "gespann-orchestrator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
hex = "0.4"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
