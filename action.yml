name: gespann
description: Run the repo's approved gespann rules on the pull request, with the same runner developers use locally.
inputs:
  base:
    description: Ref to diff against. Defaults to the PR base branch.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Build gespann
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && npm ci --silent --no-audit --no-fund && npm run build --silent
    - name: Run rules
      shell: bash
      env:
        BASE: ${{ inputs.base || (github.base_ref && format('origin/{0}', github.base_ref)) || '' }}
      run: |
        if [ -n "$BASE" ]; then node "$GITHUB_ACTION_PATH/dist/bin.js" run --ci --base "$BASE"
        else node "$GITHUB_ACTION_PATH/dist/bin.js" run --ci --all; fi
